<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>ttengine 无头自动化测试页</title>
  <style>
    body { font-family: sans-serif; background: #fff; margin: 12px; }
    canvas { border: 1px solid #999; background: #fff; margin: 4px; display: block; }
    #log { font-family: monospace; white-space: pre-wrap; font-size: 13px; }
    .pass { color: #0a7d33; font-weight: bold; }
    .fail { color: #c0271d; font-weight: bold; }
    h3 { margin: 14px 0 4px; }
  </style>
</head>
<body>
  <h3>自研引擎(WebGL 图集)</h3>
  <canvas id="canvas-ours" width="720" height="60"></canvas>
  <h3>系统渲染(Canvas 2D / DirectWrite)</h3>
  <canvas id="canvas-system" width="720" height="60"></canvas>
  <h3>差异热力图</h3>
  <canvas id="canvas-diff" width="720" height="60"></canvas>
  <div id="log">运行中…</div>
  <script type="module" src="./dist/headless.js"></script>
</body>
</html>
